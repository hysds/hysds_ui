# TEMPLATE -- do not commit a filled-in copy of this file.
#
# Create the real Secret imperatively so the credential never lands in a file
# or in your shell history (note the leading space, and set HISTCONTROL=ignorespace):
#
#  kubectl -n eagle create secret generic opensearch-credentials \
#     --from-literal=OS_HOST='vpc-eaglevswir-proto-ylwe6yiuzvfjv5voxzmk57vxfy.us-west-2.es.amazonaws.com' \
#     --from-literal=OS_USER='<user>' \
#     --from-literal=OS_PASS='<password>'
#
# Kubernetes Secrets are only base64-encoded, not encrypted, unless the cluster
# has encryption-at-rest configured. Anyone with `get secrets` in this namespace
# can read it -- keep RBAC tight. Consider a read-only OpenSearch FGAC user so
# the credential itself cannot modify the catalog.
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-credentials
  namespace: eagle
type: Opaque
stringData:
  OS_HOST: "vpc-eaglevswir-proto-ylwe6yiuzvfjv5voxzmk57vxfy.us-west-2.es.amazonaws.com"
  OS_USER: "REPLACE_ME"
  OS_PASS: "REPLACE_ME"
