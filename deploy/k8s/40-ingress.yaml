# HTTP only, per the demo requirement. Anyone who can reach this host can query
# the catalog -- the nginx proxy supplies the OpenSearch credential on their
# behalf. It is restricted to read-only endpoints, but there is no user
# authentication in front of the UI.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hysds-ui
  namespace: eagle
  # No annotations. This cluster's default IngressClass is TRAEFIK, which
  # ignores nginx.ingress.kubernetes.io/* annotations entirely -- they were
  # misleading rather than harmful. Traefik imposes no request body limit by
  # default and its timeouts are adequate for _msearch responses carrying
  # footprint geometry, so nothing equivalent is needed. If limits ever do
  # need tuning under Traefik it is done with Middleware CRDs, not annotations.
spec:
  # ingressClassName is deliberately OMITTED.
  #
  # A namespace-scoped user cannot run `kubectl get ingressclass` (it is a
  # cluster-scoped resource), so the available classes can't be discovered from
  # here. Leaving this unset makes the cluster assign its default IngressClass
  # -- the one annotated ingressclass.kubernetes.io/is-default-class: "true".
  # That is more likely correct than guessing "nginx", since Rancher ships
  # Traefik in some configurations.
  #
  # If the cluster has NO default class, the Ingress is created but never
  # programmed, and `kubectl -n eagle get ingress hysds-ui` shows an empty
  # ADDRESS. In that case ask for the class name and set it explicitly:
  #   ingressClassName: <name>
  # Very old controllers may instead need the deprecated annotation
  #   kubernetes.io/ingress.class: <name>
  rules:
    # Host-scoped, at the platform SA's request. This was briefly hostless to
    # get a shareable URL before the entry point was known -- do NOT go back to
    # that: a hostless rule is a catch-all on this Traefik instance, and Eagle
    # and Skyfall share the cluster, so it would absorb requests meant for
    # Skyfall workloads whose hostnames match no other Ingress.
    #
    # Entry path: airflowsds-gw runs HAProxy and forwards all HTTPS to Traefik
    # on airflowsds-node1, which is why the Ingress ADDRESS field stays empty
    # (there is no LoadBalancer pool) even though the route works.
    # Moved from airflowsds.jpl.nasa.gov (the platform's own hostname) to a
    # dedicated name for this app, 2026-11-17. Requires HAProxy on
    # airflowsds-gw to forward this hostname to Traefik as well -- a DNS record
    # alone is not sufficient.
    - host: eaglesds.jpl.nasa.gov
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hysds-ui
                port:
                  name: http
